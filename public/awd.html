function exp(tok){try{var p=JSON.parse(atob(tok.split('.')[1]));return p.exp<Math.floor(Date.now()/1000);}catch(e){return true;}}
async function refresh(){
  var r=localStorage.getItem('mozok_refresh');if(!r)return null;

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--moz:#0d5ba5;--bg:#f9f9f8;--surface:#fff;--border:rgba(0,0,0,.1);--text:#1a1a18;--text-2:#5f5e5a;--text-3:#888780;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:0 0 3rem;}
  .app{max-width:1000px;margin:0 auto;padding:0 1.5rem;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:.5px solid var(--border);margin-bottom:1.5rem;}
  .logo{font-size:20px;font-weight:600;color:var(--moz);}
  .logo span{color:var(--text-3);font-weight:400;font-size:13px;margin-left:8px;}
  a.back{font-size:13px;color:var(--text-2);text-decoration:none;}
  .section{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .section h2{font-size:15px;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top;}
  th{color:var(--text-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  select,textarea{font-family:inherit;font-size:13px;padding:5px 7px;border:1px solid #ccc;border-radius:6px;width:100%;}
  textarea{min-height:34px;resize:vertical;}
  .acct-name{font-weight:600;}
  .acct-note{color:#777;font-size:12px;}
  button{background:var(--moz);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;}
  button:hover{opacity:.9;}
  .save-msg{font-size:12px;color:#167a3d;margin-left:8px;opacity:0;transition:opacity .2s;}
  .save-msg.show{opacity:1;}
  .hist{font-size:12px;color:#555;}
  .hist div{padding:3px 0;border-top:1px dashed #eee;}
  .loading{color:var(--text-3);font-size:13px;padding:20px 0;}
</style>

    <a class="back" href="/dashboard.html">&larr; Dashboard</a>
  </div>

  <div id="loading" class="loading">Loading accounts…</div>

  <div class="section" id="sisterSection" style="display:none;">
    <h2>Sister-location leads</h2>
    <table><tbody id="sisterBody"></tbody></table>
  </div>

  <div class="section" id="winbackSection" style="display:none;">
    <h2>Win-back accounts (lapsed, credit on file, no sales this period)</h2>
    <table><tbody id="winbackBody"></tbody></table>
  </div>

  <div class="section" id="prospectSection">
    <h2>Step 3 — New prospects (Apollo)</h2>
    <p style="font-size:12px;color:#888;margin-bottom:10px;">Defined here, not run yet. Win-back and sister-location come first — flip Active on when those are exhausted.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div style="grid-column:1/-1;">
        <label style="font-size:12px;color:#888;">Target profile (who's the ideal new customer)</label>
        <textarea id="pc-profile" placeholder="e.g. CNC machine shops and tool & die shops, 10-200 employees, in-house carbide drill usage" style="width:100%;min-height:50px;"></textarea>
      </div>
      <div>
        <label style="font-size:12px;color:#888;">Industries (comma-separated)</label>
        <input id="pc-industries" placeholder="Machining, Tool & Die, Metal Fabrication" style="width:100%;" />
      </div>
      <div>
        <label style="font-size:12px;color:#888;">Job titles (comma-separated)</label>
        <input id="pc-titles" placeholder="Owner, Purchasing Manager, Operations Manager" style="width:100%;" />
      </div>
      <div>
        <label style="font-size:12px;color:#888;">Locations (semicolon-separated)</label>
        <input id="pc-locations" placeholder="Ontario, Canada; Michigan, United States" style="width:100%;" />
      </div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;">
          <label style="font-size:12px;color:#888;">Company size min</label>
          <input id="pc-size-min" type="number" style="width:100%;" />
        </div>
        <div style="flex:1;">
          <label style="font-size:12px;color:#888;">Company size max</label>
          <input id="pc-size-max" type="number" style="width:100%;" />
        </div>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:8px;">
      <label style="font-size:13px;"><input type="checkbox" id="pc-active" /> Active (runs the Apollo pull)</label>
      <button id="pc-save">Save criteria</button>
      <span class="save-msg" id="pc-save-msg">Saved</span>
    </div>
  </div>

  <div id="errorBox" style="display:none;color:#b3261e;font-size:13px;"></div>
</div>

<script>
let ACCOUNTS = [];
let LOGS = {};

function historyFor(id) {
  return (LOGS[id] || []).slice().sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
}

const CHANNELS = ['note','phone','email','text','linkedin','facebook','instagram'];
const CHANNEL_LABEL = { note:'Note', phone:'Phone', email:'Email', text:'Text', linkedin:'LinkedIn', facebook:'Facebook', instagram:'Instagram' };

function rowHtml(a) {
  const hist = historyFor(a.id);
  const histHtml = hist.length
    ? hist.map(h => `<div><strong>${new Date(h.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</strong> [${CHANNEL_LABEL[h.channel]||'Note'}] — ${h.note}</div>`).join('')
    : '<div style="color:#aaa;">No entries yet</div>';
  const channelOptions = CHANNELS.map(c => `<option value="${c}">${CHANNEL_LABEL[c]}</option>`).join('');
  return `<tr>
    <td style="width:20%">
      <div class="acct-name">${a.name}</div><div class="acct-note">${a.note || ''}</div>
      <input data-contact-name="${a.id}" placeholder="Contact name" value="${a.contact_name || ''}" style="margin-top:6px;" />
      <input data-contact-email="${a.id}" placeholder="Contact email" value="${a.contact_email || ''}" style="margin-top:4px;" />
    </td>
    <td style="width:10%">
      <select data-account="${a.id}" class="status-select">
        <option value="not_started">Not started</option>
        <option value="attempted">Attempted</option>
        <option value="responded">Responded</option>
        <option value="converted">Converted</option>
        <option value="do_not_contact">Do not contact</option>
      </select>
    </td>
    <td style="width:32%">
      <select data-channel="${a.id}" class="channel-select" style="margin-bottom:4px;">${channelOptions}</select>
      <textarea data-account="${a.id}" placeholder="Log this interaction..."></textarea>
      <button data-account="${a.id}" class="log-btn">Save entry</button>
      <span class="save-msg" data-account-msg="${a.id}">Saved</span>
      <div style="margin-top:8px;border-top:1px dashed #eee;padding-top:8px;">
        <input data-email-subject="${a.id}" placeholder="Email subject" style="margin-bottom:4px;" />
        <textarea data-email-body="${a.id}" placeholder="Email body..."></textarea>
        <button data-account="${a.id}" class="send-email-btn" style="background:#0b5cab;">Send email (auto-logs)</button>
      </div>
    </td>
    <td style="width:38%"><div class="hist" data-account-hist="${a.id}">${histHtml}</div></td>
  </tr>`;
}

function render() {
  const sister = ACCOUNTS.filter(a => a.play_group === 'sister');
  const winback = ACCOUNTS.filter(a => a.play_group === 'winback');
  document.getElementById('sisterBody').innerHTML = `<tr><th>Account</th><th>Status</th><th>Log this interaction</th><th>History</th></tr>` + sister.map(rowHtml).join('');
  document.getElementById('winbackBody').innerHTML = `<tr><th>Account</th><th>Status</th><th>Log this interaction</th><th>History</th></tr>` + winback.map(rowHtml).join('');
  document.getElementById('sisterSection').style.display = '';
  document.getElementById('winbackSection').style.display = '';
  document.getElementById('loading').style.display = 'none';

  function refreshHist(id) {
    document.querySelector(`[data-account-hist="${id}"]`).innerHTML = historyFor(id).map(h => `<div><strong>${new Date(h.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</strong> [${CHANNEL_LABEL[h.channel]||'Note'}] — ${h.note}</div>`).join('') || '<div style="color:#aaa;">No entries yet</div>';
  }
  function flashSaved(id) {
    const msg = document.querySelector(`[data-account-msg="${id}"]`);
    if (!msg) return;
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 1200);
  }

  ACCOUNTS.forEach(a => {
    const sel = document.querySelector(`select[data-account="${a.id}"]`);
    if (!sel) return;
    sel.value = a.status;
    sel.addEventListener('change', async () => {
      await fetch('/api/awd/accounts/' + a.id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: sel.value }) });
      a.status = sel.value;
    });

    // Contact name/email — save on blur, no separate button needed
    const nameInput = document.querySelector(`input[data-contact-name="${a.id}"]`);
    const emailInput = document.querySelector(`input[data-contact-email="${a.id}"]`);
    async function saveContact() {
      await fetch('/api/awd/accounts/' + a.id + '/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contact_name: nameInput.value.trim(), contact_email: emailInput.value.trim() }) });
      a.contact_name = nameInput.value.trim();
      a.contact_email = emailInput.value.trim();
    }
    nameInput.addEventListener('blur', saveContact);
    emailInput.addEventListener('blur', saveContact);
  });

  document.querySelectorAll('.log-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-account');
      const ta = document.querySelector(`textarea[data-account="${id}"]`);
      const channelSel = document.querySelector(`select[data-channel="${id}"]`);
      const note = ta.value.trim();
      if (!note) return;
      const r = await fetch('/api/awd/accounts/' + id + '/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ note, channel: channelSel.value }) });
      const d = await r.json();
      if (d.entry) {
        LOGS[id] = LOGS[id] || [];
        LOGS[id].push(d.entry);
        ta.value = '';
        refreshHist(id);
        flashSaved(id);
      }
    });
  });

  // Send email — this IS the interaction, so it logs itself. No manual note after.
  document.querySelectorAll('.send-email-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-account');
      const subjectInput = document.querySelector(`input[data-email-subject="${id}"]`);
      const bodyInput = document.querySelector(`textarea[data-email-body="${id}"]`);
      const subject = subjectInput.value.trim();
      const body = bodyInput.value.trim();
      if (!subject || !body) return;
      btn.disabled = true;
      btn.textContent = 'Sending...';
      const r = await fetch('/api/awd/accounts/' + id + '/send-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subject, body }) });
      const d = await r.json();
      btn.disabled = false;
      btn.textContent = 'Send email (auto-logs)';
      if (d.error) { alert(d.error); return; }
      if (d.entry) {
        LOGS[id] = LOGS[id] || [];
        LOGS[id].push(d.entry);
        subjectInput.value = '';
        bodyInput.value = '';
        refreshHist(id);
        flashSaved(id);
      }
    });
  });
}

async function load() {
  try {
    const r = await fetch('/api/awd/accounts');
    const d = await r.json();
    if (d.error) { document.getElementById('errorBox').style.display = ''; document.getElementById('errorBox').textContent = d.error; document.getElementById('loading').style.display = 'none'; return; }
    ACCOUNTS = d.accounts || [];
    LOGS = {};
    (d.logs || []).forEach(l => { LOGS[l.account_id] = LOGS[l.account_id] || []; LOGS[l.account_id].push(l); });
    render();
  } catch (e) {
    document.getElementById('errorBox').style.display = '';
    document.getElementById('errorBox').textContent = 'Failed to load: ' + e.message;
    document.getElementById('loading').style.display = 'none';
  }
}
load();

async function loadCriteria() {
  try {
    const r = await fetch('/api/awd/prospect-criteria');
    const d = await r.json();
    const c = d.criteria || {};
    document.getElementById('pc-profile').value = c.target_profile || '';
    document.getElementById('pc-industries').value = c.industries || '';
    document.getElementById('pc-titles').value = c.job_titles || '';
    document.getElementById('pc-locations').value = c.locations || '';
    document.getElementById('pc-size-min').value = c.company_size_min || 1;
    document.getElementById('pc-size-max').value = c.company_size_max || 200;
    document.getElementById('pc-active').checked = !!c.active;
  } catch (e) {}
}
loadCriteria();

document.getElementById('pc-save').addEventListener('click', async () => {
  const payload = {
    target_profile: document.getElementById('pc-profile').value.trim(),
    industries: document.getElementById('pc-industries').value.trim(),
    job_titles: document.getElementById('pc-titles').value.trim(),
    locations: document.getElementById('pc-locations').value.trim(),
    company_size_min: parseInt(document.getElementById('pc-size-min').value) || 1,
    company_size_max: parseInt(document.getElementById('pc-size-max').value) || 200,
    active: document.getElementById('pc-active').checked
  };
  await fetch('/api/awd/prospect-criteria', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const msg = document.getElementById('pc-save-msg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 1200);
});
</script>
</body>
