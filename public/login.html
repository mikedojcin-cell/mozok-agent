<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozok — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --moz: #1D9E75;
    --moz-dark: #085041;
    --bg: #080d14;
    --bg2: #0d1420;
    --border: #1e2535;
    --border2: #2a3347;
    --text1: #ffffff;
    --text2: #94a3b8;
    --text3: #4b5563;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text1); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 400px; padding: 24px; }
  .logo-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  input { width: 100%; padding: 11px 14px; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; color: #fff; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; margin-bottom: 16px; }
  input:focus { border-color: var(--moz); }
  input::placeholder { color: var(--text3); }
  .btn { width: 100%; padding: 12px; background: var(--moz); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; transition: background 0.15s; }
  .btn:hover { background: var(--moz-dark); }
  .err { background: rgba(197,15,31,0.1); border: 1px solid rgba(197,15,31,0.3); color: #e74c3c; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 14px; display: none; }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--text3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <span class="logo">mozok</span>
  </div>
  <div class="card">
    <h2>Sign in</h2>
    <p class="sub">Mozok Outlook Agent</p>
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Sign In</button>
    <div class="err" id="err"></div>
  </div>
  <div class="footer">mozok.co &nbsp;·&nbsp; Social media. Handled.</div>
</div>
<script>
(function() {
  if (sessionStorage.getItem('mozok_auth') === 'true') {
    window.location.href = '/';
  }
})();

function login() {
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (password === 'mozok2024') {
    sessionStorage.setItem('mozok_auth', 'true');
    window.location.href = '/';
  } else {
    err.textContent = 'Invalid password. Please try again.';
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
