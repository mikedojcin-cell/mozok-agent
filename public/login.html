<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozok Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#080d14;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:400px;padding:24px}
.logo-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.logo{font-size:24px;font-weight:700;color:#fff;letter-spacing:-0.5px}
.card{background:#0d1420;border:1px solid #1e2535;border-radius:16px;padding:32px}
h2{font-size:20px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:#4b5563;margin-bottom:28px}
label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px;font-weight:500}
input{width:100%;padding:11px 14px;background:#080d14;border:1px solid #2a3347;border-radius:8px;color:#fff;font-size:14px;outline:none;font-family:inherit;margin-bottom:16px}
input:focus{border-color:#1D9E75}
.btn{width:100%;padding:12px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;transition:background 0.15s}
.btn:hover:not(:disabled){background:#085041}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.err{background:rgba(197,15,31,0.1);border:1px solid rgba(197,15,31,0.3);color:#e74c3c;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#4b5563}
</style>
</head>
<body>
<div class="wrap">
<div class="logo-row"><span class="logo">mozok</span></div>
<div class="card">
<h2>Sign in</h2>
<p class="sub">Mozok Outlook Agent</p>
<label>Email</label>
<input type="email" id="em" placeholder="you@example.com" onkeydown="if(event.key==='Enter')go()">
<label>Password</label>
<input type="password" id="pw" placeholder="password" onkeydown="if(event.key==='Enter')go()">
<button class="btn" id="btn" onclick="go()">Sign In</button>
<div class="err" id="err"></div>
</div>
<div class="footer">mozok.co - Social media. Handled.</div>
</div>
<script>
var SB='https://kwyycykglqrokqsbuiny.supabase.co';
var AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3eXljeWtnbHFyb2txc2J1aW55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Nzk5MTksImV4cCI6MjA5NDI1NTkxOX0.pw2ej0U3xgd-i-1Xub_jWq7iI5RZC7N4f43jFSc9DfM';
(function(){if(localStorage.getItem('mozok_token'))window.location.href='/';})();
async function go(){
var e=document.getElementById('em').value.trim();
var p=document.getElementById('pw').value;
var err=document.getElementById('err');
var btn=document.getElementById('btn');
err.style.display='none';
if(!e||!p){err.textContent='Enter email and password.';err.style.display='block';return;}
btn.disabled=true;btn.textContent='Signing in...';
try{
var r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':AK},body:JSON.stringify({email:e,password:p})});
var d=await r.json();
if(d.access_token){localStorage.setItem('mozok_token',d.access_token);localStorage.setItem('mozok_refresh',d.refresh_token||'');window.location.href='/';}
else{err.textContent=d.error_description||d.msg||'Invalid email or password.';err.style.display='block';btn.disabled=false;btn.textContent='Sign In';}
}catch(x){err.textContent='Network error.';err.style.display='block';btn.disabled=false;btn.textContent='Sign In';}
}
</script>
</body>
</html>
