<title>Mozok — Sign In</title>

<style>
  :root {
    --moz: #1D9E75;
    --moz-dark: #085041;
    --bg: #080d14;
    --bg2: #0d1420;
    --border: #1e2535;
    --border2: #2a3347;
    --text1: #ffffff;
    --text2: #94a3b8;
    --text3: #4b5563;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text1); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 400px; padding: 24px; }
  .logo-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
  .logo-img { width: 40px; height: 40px; object-fit: contain; }
  .logo { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--text3); margin-bottom: 28px; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  input { width: 100%; padding: 11px 14px; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; color: #fff; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; margin-bottom: 16px; }
  input:focus { border-color: var(--moz); }
  input::placeholder { color: var(--text3); }
  .btn { width: 100%; padding: 12px; background: var(--moz); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; transition: background 0.15s; }
  .btn:hover { background: var(--moz-dark); }
  .btn:disabled { background: var(--border2); cursor: not-allowed; }
  .spin { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .err { background: rgba(197,15,31,0.1); border: 1px solid rgba(197,15,31,0.3); color: #e74c3c; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 14px; display: none; }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--text3); }
</style>
</head>

  <div class="card">
    <h2>Sign in</h2>
    <p class="sub">Mozok Outlook Agent</p>
    <label>Email</label>
    <input type="email" id="email" placeholder="you@mozok.co" autocomplete="email">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" id="loginBtn" onclick="login()">
      <span class="spin" id="sp"></span>
      Sign In
    </button>
    <div class="err" id="err"></div>
  </div>
  <div class="footer">mozok.co &nbsp;·&nbsp; Social media. Handled.</div>
</div>
<script>
const SUPABASE_URL = 'https://kwyycykglqrokqsbuiny.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3eXljeWtnbHFyb2txc2J1aW55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Nzk5MTksImV4cCI6MjA5NDI1NTkxOX0.pw2ej0U3xgd-i-1Xub_jWq7iI5RZC7N4f43jFSc9DfM';

(function() {
  const s = localStorage.getItem('mozok_session');
  if (s) {
    try {
      const p = JSON.parse(s);
      if (p.access_token && (!p.expires_at || Date.now()/1000 < p.expires_at)) {
        window.location.href = '/';
        return;
      }
    } catch(e) {}
    localStorage.removeItem('mozok_session');
  }
})();

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('loginBtn');
  const sp = document.getElementById('sp');
  err.style.display = 'none';
  if (!email || !password) { err.textContent = 'Please enter your email and password.'; err.style.display = 'block'; return; }
  btn.disabled = true; sp.style.display = 'inline-block';
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('mozok_session', JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Math.floor(Date.now()/1000) + (data.expires_in || 3600),
        user: data.user
      }));
      window.location.href = '/';
    } else {
      err.textContent = data.error_description || data.msg || 'Invalid email or password.';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Connection error. Please try again.';
    err.style.display = 'block';
  }
  btn.disabled = false; sp.style.display = 'none';
}
</script>
